[project]
name = "indextts-emotion-onnx-tools"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=2.0,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "safetensors>=0.5,<1",
  "torch==2.8.*",
  "transformers==4.52.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
